<!DOCTYPE html>

    <style>
        :root {
            --primary: #3b82f6; --accent: #60a5fa; --neon-blue: #00d4ff;
            --bg-dark: #020617; --card-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08); --text-main: #f8fafc;
            --text-muted: #94a3b8; --success: #22c55e; --error: #ef4444; --admin-color: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }
        body { min-height: 100vh; background: radial-gradient(circle at top left, #0f172a, #020617); color: var(--text-main); overflow-x: hidden; display: flex; flex-direction: column; }
        
        .topbar { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items: center; padding: 0 5%; border-bottom: 1px solid var(--glass-border); z-index: 1000; }
        .brand-link { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
        .brand-icon { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 18px rgba(96, 165, 250, 0.45); }
        .title-text { font-size: 20px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(to right, #fff, var(--neon-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .nav-buttons { display: flex; gap: 15px; align-items: center; }
        .btn-nav { color: white; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 12px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: 0.3s; }
        .btn-add-idea { background: linear-gradient(135deg, #22c55e, #10b981); }
        .btn-admin-nav { background: linear-gradient(135deg, #f59e0b, #d97706); display: none; }
        .btn-login { background: rgba(255, 255, 255, 0.05); position: relative; }

        .user-menu { position: absolute; top: calc(100% + 10px); right: 0; background: #0f172a; border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px; width: 160px; display: none; flex-direction: column; gap: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1100; }
        .user-menu.active { display: flex; }
        .menu-item { padding: 10px; border-radius: 8px; color: var(--text-main); font-size: 11px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 10px; transition: 0.2s; cursor: pointer; }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: var(--error); }

        .container { padding-top: 130px; width: 95%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; flex: 1; }
        .logo { margin-bottom: 50px; max-width: 250px; filter: drop-shadow(0 0 25px var(--primary)); animation: logoFloat 2.8s ease-in-out infinite; }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 20px var(--primary)); }
            50% { transform: translateY(-8px) scale(1.02); filter: drop-shadow(0 0 34px var(--neon-blue)); }
        }
        .buttons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; width: 100%; }
        
        .btn-rule { 
            background: var(--card-bg); border: 1px solid var(--glass-border); padding: 35px 20px; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; opacity: 0; transform: translateY(20px); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-rule.show { opacity: 1; transform: translateY(0); }
        .btn-rule:hover { transform: translateY(-10px) !important; border-color: var(--neon-blue); box-shadow: 0 15px 35px rgba(0, 212, 255, 0.25); background: rgba(255, 255, 255, 0.06); }
        
        .btn-rule i { font-size: 65px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; transition: 0.3s; }
        .btn-rule:hover i { transform: scale(1.15); }
        
        .btn-rule span { font-size: 18px; font-weight: 700; text-transform: uppercase; color: #f8fafc; text-align: center; letter-spacing: 0.5px; }

        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(15px); opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-content { width: 860px; max-width: 94vw; max-height: 84vh; background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(2, 6, 23, 0.98)); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 28px; padding: 40px 32px 32px; position: relative; overflow-y: auto; transform: scale(0.94); transition: transform 0.4s; box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55); }
        .modal.open .modal-content { transform: scale(1); }
        .close-btn { position: absolute; top: 18px; right: 18px; font-size: 18px; cursor: pointer; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, 0.06); z-index: 10; border: 1px solid rgba(255,255,255,0.08); transition: 0.2s; }
        .close-btn:hover { background: rgba(255,255,255,0.12); transform: rotate(90deg); }

        .cat-header { display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 900; margin-bottom: 28px; text-transform: uppercase; text-align: center; }
        .cat-header i { font-size: 74px; margin-bottom: 6px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .cat-header span { font-size: 24px; letter-spacing: 0.5px; }
        .cat-header p { color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: none; line-height: 1.5; }

        #notification-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column-reverse; gap: 15px; z-index: 9999; }
        .notif { background: rgba(15, 23, 42, 0.95); border: 1px solid var(--glass-border); padding: 20px; border-radius: 16px; width: 320px; border-left: 5px solid var(--primary); animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .notif-title { font-weight: 800; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
        .notif-msg { font-size: 13px; color: var(--text-muted); }

        .admin-item { background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 18px; border: 1px solid var(--glass-border); border-left: 5px solid var(--admin-color); margin-bottom: 20px; }
        .adm-actions { display: flex; gap: 12px; margin-top: 15px; }
        .btn-adm-act { flex: 1; padding: 10px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; color: white; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .st-approved { border-left-color: var(--success); }
        .st-rejected { border-left-color: var(--error); }
        
        .rule-item { background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.025)); padding: 18px 20px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.12); margin-bottom: 12px; font-family: 'Montserrat', sans-serif; font-weight: 700; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
        .rule-title { font-size: 15px; font-weight: 800; color: #ffffff; line-height: 1.45; margin-bottom: 6px; }
        .rule-desc { font-size: 13px; color: var(--text-muted); line-height: 1.55; font-weight: 600; }
        .punish-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 170px; }
        .punish-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; }
        .punish-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid; box-shadow: 0 8px 18px rgba(0,0,0,0.2); }
        .punish-red { color: #fecaca; background: linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(248, 113, 113, 0.12)); border-color: rgba(248, 113, 113, 0.35); }
        .punish-orange { color: #fde68a; background: linear-gradient(135deg, rgba(245, 158, 11, 0.24), rgba(251, 191, 36, 0.12)); border-color: rgba(251, 191, 36, 0.33); }
        .rules-filter { width: 100%; margin-bottom: 28px; padding: 20px; background: rgba(255,255,255,0.035); border: 1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(10px); }
        .rules-search-wrap { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; background: rgba(2,6,23,0.55); }
        .rules-search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(96,165,250,0.14); }
        .rules-search-wrap svg { width: 20px; height: 20px; flex: 0 0 auto; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .rules-search { width: 100%; min-height: 48px; border: none; outline: none; background: transparent; color: var(--text-main); font: inherit; font-size: 14px; }
        .rules-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(96,165,250,0.14); }
        .rules-search::placeholder { color: var(--text-muted); }
        .rules-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .rules-tab { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 10px 15px; color: var(--text-main); background: rgba(255,255,255,0.06); cursor: pointer; font: inherit; font-size: 12px; font-weight: 800; text-transform: uppercase; transition: 0.2s; }
        .rules-tab svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .rules-tab:hover, .rules-tab.active { background: var(--primary); border-color: var(--accent); }
        .filtered-rules { display: none; width: 100%; margin-bottom: 28px; }
        .filtered-rules.active { display: block; }
        .filtered-rules-title { color: var(--text-muted); font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
        .filtered-rule .rule-source { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .empty-rules { color: var(--text-muted); text-align: center; padding: 24px; border: 1px dashed var(--glass-border); border-radius: 16px; }
        .no-results { padding: 28px 20px; text-align: center; color: var(--accent); background: rgba(0, 87, 183, 0.12); border: 1px solid rgba(255, 215, 0, 0.28); border-radius: 16px; font-size: 15px; font-weight: 800; }
        @media (max-width: 620px) { .rule-item { flex-direction: column; } .punish-wrap { align-items: flex-start; min-width: 0; } }
        .zone-map-frame { width: 100%; margin-bottom: 20px; padding: 8px; border: 1px solid rgba(0, 212, 255, 0.45); border-radius: 20px; background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(255, 255, 255, 0.03)); box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.08), 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 28px rgba(0, 212, 255, 0.12); }
        .zone-map-frame img { width: 100%; max-height: 320px; display: block; object-fit: contain; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(2, 6, 23, 0.55); }
        .footer-copyright { padding: 25px; text-align: center; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--glass-border); }
        #userPic { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    </style>
</head>

    function initGrid() {
        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('rulesSearch').addEventListener('input', renderFilteredRules);
        document.querySelectorAll('.rules-tab').forEach(tab => tab.addEventListener('click', () => {
            document.querySelectorAll('.rules-tab').forEach(item => item.classList.remove('active'));
            tab.classList.add('active');
            renderFilteredRules();
        }));
        renderFilteredRules();
    }

    function getRuleType(rule) {
        const punishment = rule.punish.toLowerCase();
        const text = `${rule.title} ${punishment}`;
        return {
            isBan: /бан|перманент/.test(punishment),
            isFine: /штраф|€/.test(punishment),
            isSerious: /бан|перманент|кпз|конфіскац|убив|збро|граб|напад/.test(text)
        };
    }

    function renderFilteredRules() {
        const query = document.getElementById('rulesSearch').value.trim().toLowerCase();
        const filter = document.querySelector('.rules-tab.active').dataset.filter;
        const grid = document.getElementById('btnGrid');
        const matchingCategories = categories.filter(cat => getVisibleRules(cat, filter, query).length > 0);
        grid.innerHTML = '';

        matchingCategories.forEach(cat => {
            const idx = categories.indexOf(cat);
            const btn = document.createElement('div');
            btn.className = 'btn-rule show';
            btn.innerHTML = `<i class="${cat.icon}"></i><span>${cat.name}</span>`;
            btn.onclick = () => openModal(idx);
            grid.appendChild(btn);
        });

        const section = document.getElementById('filteredRules');
        const list = document.getElementById('filteredRulesList');
        const hasNoResults = query.length > 0 && matchingCategories.length === 0;
        section.classList.toggle('active', hasNoResults);
        if (hasNoResults) {
            document.getElementById('filteredRulesTitle').textContent = 'Результат пошуку';
            list.innerHTML = '<div class="no-results">Нічого не знайдено. Перевірте написання правила.</div>';
        } else {
            list.innerHTML = '';
        }
    }

    function getVisibleRules(cat, filter, query) {
        return cat.rules.filter(rule => {
            const text = `${cat.name} ${rule.title} ${rule.desc} ${rule.punish}`.toLowerCase();
            const type = getRuleType(rule);
            const matchesFilter = filter === 'all' || (filter === 'ban' && type.isBan) || (filter === 'fine' && type.isFine) || (filter === 'serious' && type.isSerious);
            return matchesFilter && (!query || text.includes(query));
        });
    }

    function openModal(idx) {
        const body = document.getElementById('modalBody');
        const cat = categories[idx];
        const filter = document.querySelector('.rules-tab.active').dataset.filter;
        const query = document.getElementById('rulesSearch').value.trim().toLowerCase();
        const visibleRules = getVisibleRules(cat, filter, query);
        body.innerHTML = `<div class="cat-header"><i class="${cat.icon}"></i><span>${cat.name}</span><p style="color:var(--text-muted); font-size:14px; font-weight:600; text-transform:none;">${cat.subtitle}</p></div>`;

        if (cat.name.includes('Зелені зони')) {
            body.innerHTML += `<div class="zone-map-frame"><img src="image_247891.png" alt="Карта зелених зон"></div>`;
        }

        visibleRules.forEach(rule => {
            const isRed = /депортац|бан|перманент|конфіскац/i.test(rule.punish);
            body.innerHTML += `
                <div class="rule-item">
                    <div>
                        <div class="rule-title">${rule.title}</div>
                        ${rule.desc ? `<div class="rule-desc">${rule.desc}</div>` : ''}
                    </div>
                    ${rule.punish ? `<div class="punish-wrap"><span class="punish-label">Покарання</span><span class="punish-tag ${isRed ? 'punish-red' : 'punish-orange'}"><i class="fa-solid fa-circle-exclamation"></i>${rule.punish}</span></div>` : ''}
                </div>
            `;
        });

        const modal = document.getElementById('modal');
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        setTimeout(() => modal.classList.add('open'), 10);
    }

    function handleIdeaButtonClick() {
        if (!window.userLoggedIn) showNotification('УВАГА!', 'Спочатку увійдіть через Google.', 'var(--admin-color)'); 
        else openIdeaModal();
    }

    function openIdeaModal() {
        document.getElementById('modalBody').innerHTML = `<div class="cat-header"><i class="fa-solid fa-lightbulb"></i>ВАША ІДЕЯ</div><textarea id="ideaText" style="width: 100%; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 15px; padding: 15px; color: white; resize: none; font-size: 16px; outline:none;" placeholder="Опишіть ідею..."></textarea><div style="text-align:center; margin-top:20px;"><button id="submitIdeaBtn" style="background: var(--success); color: white; border: none; padding: 12px 40px; border-radius: 10px; font-weight: 700; cursor: pointer;" onclick="sendIdea()">НАДІСЛАТИ</button></div>`;
        const modal = document.getElementById('modal'); modal.style.display = 'flex'; setTimeout(() => modal.classList.add('open'), 10);
    }

    function sendIdea() {
        const now = Date.now();
        const lastSent = localStorage.getItem('last_idea_time') || 0;
        const cooldown = 180000; 
        const diff = now - lastSent;

        if (diff < cooldown) {
            const rem = cooldown - diff;
            const m = Math.floor(rem / 60000);
            const s = Math.ceil((rem % 60000) / 1000);
            let timeText = m > 0 ? `${m} хв. та ${s} сек.` : `${s} сек.`;
            return showNotification('УВАГА!', `Наступна спроба через ${timeText}`, 'var(--admin-color)');
        }

        const text = document.getElementById('ideaText').value; 
        if(!text.trim()) return showNotification('УВАГА!', 'Поле не може бути порожнім.', 'var(--admin-color)');
        
        const btn = document.getElementById('submitIdeaBtn'); 
        btn.innerHTML = '<i class="fa-solid fa-clock fa-spin"></i> НАДСИЛАННЯ...';

        setTimeout(() => {
            const ideas = JSON.parse(localStorage.getItem('server_ideas') || '[]');
            ideas.push({ id: Date.now(), email: window.userEmail, text: text, date: new Date().toLocaleString(), status: 'pending', notified: false });
            localStorage.setItem('server_ideas', JSON.stringify(ideas));
            localStorage.setItem('last_idea_time', Date.now());

            document.getElementById('modalBody').innerHTML = '<div style="text-align:center; padding:20px;"><i class="fa-solid fa-circle-check" style="font-size:60px; color:var(--success);"></i><h2 style="margin-top:15px;">НАДІСЛАНО!</h2><p style="color:var(--text-muted); margin:15px 0;">Адміністратор перевірить вашу ідею. Дякуємо!</p><button onclick="closeModal()" class="btn-nav btn-add-idea" style="margin:0 auto;">ЗАКРИТИ</button></div>';
        }, 1200);
    }

    function showNotification(title, msg, color) {
        const container = document.getElementById('notification-container');
        const notif = document.createElement('div'); notif.className = 'notif';
        notif.style.borderLeftColor = color;
        notif.innerHTML = `<div class="notif-title" style="color:${color}">${title}</div><div class="notif-msg">${msg}</div>`;
        container.appendChild(notif);
        setTimeout(() => { notif.style.opacity = '0'; setTimeout(() => notif.remove(), 500); }, 5000);
    }

    function openAdminPanel() {
        const body = document.getElementById('modalBody'); 
        const ideas = JSON.parse(localStorage.getItem('server_ideas') || '[]');
        body.innerHTML = '<div class="cat-header"><i class="fa-solid fa-user-shield"></i><span>ПАНЕЛЬ АДМІНІСТРАТОРА</span></div>';
        if(!ideas.length) body.innerHTML += '<p style="text-align:center; color:var(--text-muted);">Ідей немає.</p>';
        [...ideas].reverse().forEach(i => {
            let st = i.status === 'approved' ? 'st-approved' : (i.status === 'rejected' ? 'st-rejected' : '');
            body.innerHTML += `<div class="admin-item ${st}"><small>${i.date} | ${i.email}</small><p style="margin:8px 0;">${i.text}</p><div class="adm-actions"><button class="btn-adm-act" style="background:var(--success)" onclick="updateIdea(${i.id}, 'approved')" ${i.status!=='pending'?'disabled':''}>ТАК</button><button class="btn-adm-act" style="background:var(--error)" onclick="updateIdea(${i.id}, 'rejected')" ${i.status!=='pending'?'disabled':''}>НІ</button><button class="btn-adm-act" style="background:#444" onclick="deleteIdea(${i.id})">🗑️</button></div></div>`;
        });
        const modal = document.getElementById('modal'); modal.style.display = 'flex'; setTimeout(() => modal.classList.add('open'), 10);
    }

    window.updateIdea = (id, status) => {
        let ideas = JSON.parse(localStorage.getItem('server_ideas') || '[]');
        const idx = ideas.findIndex(i => i.id === id);
        if(idx !== -1) { 
            ideas[idx].status = status; ideas[idx].notified = false; 
            localStorage.setItem('server_ideas', JSON.stringify(ideas)); 
            openAdminPanel();
        }
    }

    window.deleteIdea = (id) => {
        let ideas = JSON.parse(localStorage.getItem('server_ideas') || '[]');
        localStorage.setItem('server_ideas', JSON.stringify(ideas.filter(i => i.id !== id))); 
        openAdminPanel();
    }

    window.closeModal = () => {
        document.getElementById('modal').classList.remove('open');
        document.body.style.overflow = '';
        setTimeout(() => document.getElementById('modal').style.display = 'none', 400);
    }
    window.closeAllMenus = (e) => { if (!e.target.closest('#authBtn')) document.getElementById('userMenu')?.classList.remove('active'); }

    console.log('%cСторінка правил VolynRP', 'font-size:16px; font-weight:700; color:#60a5fa;');
    console.log('%cАвторські права захищені законами всіх країн. Будь-яке копіювання, змінення та поширення без дозволу заборонено.', 'font-size:12px; color:#94a3b8;');
    console.log('%cЯкщо ви бачите це повідомлення — ви перебуваєте в консолі розробника F12. Поважайте інтелектуальну власність.', 'font-size:12px; color:#a5b4fc;');

    window.onload = initGrid;
</script>
